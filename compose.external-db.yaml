name: specweave-external
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set external postgresql+psycopg DATABASE_URL in .env}
      DATA_ROOT: /data
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:?Set BOOTSTRAP_TOKEN in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEARXNG_URL: ${SEARXNG_URL:-}
    volumes:
      - projects_data:/data
    shm_size: "1gb"
    security_opt: ["no-new-privileges:true"]
  review-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    command: ["python", "source/review_worker.py"]
    healthcheck: {disable: true}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set external postgresql+psycopg DATABASE_URL in .env}
      DATA_ROOT: /data
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      SPECWEAVE_MIGRATIONS_MANAGED: "true"
      SPECWEAVE_CHAT_CONCURRENCY: ${SPECWEAVE_CHAT_CONCURRENCY:-4}
    depends_on:
      web: {condition: service_healthy}
    volumes:
      - projects_data:/data
    security_opt: ["no-new-privileges:true"]
volumes:
  projects_data:
