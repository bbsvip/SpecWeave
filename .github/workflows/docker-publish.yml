name: Build and publish SpecWeave images

# Build on GitHub-hosted runners; deployment hosts only pull images.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: specweave-images-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    name: Run source tests before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio pyyaml
      - name: Python checks and tests
        run: |
          python -m compileall -q source tests migrations
          python -m pytest -q tests
      - name: JavaScript checks
        run: |
          find source/static/js -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          node --check source/pi_host.mjs
          node --check source/pi_host_oauth.mjs
          node --check source/pi_host_tools.mjs
          node --check source/openai_oauth.mjs
          node --check source/pi_device_id.mjs
          node --test tests/test_openai_oauth_contract.mjs tests/test_pi_native_host.mjs

  publish:
    name: Publish web (amd64)
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Normalize GHCR repository name
        id: names
        shell: bash
        run: |
          echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.names.outputs.repo }}-web
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=SpecWeave web service
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=specweave-web
          cache-to: type=gha,scope=specweave-web,mode=max
