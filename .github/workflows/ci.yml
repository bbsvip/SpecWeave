name: SpecWeave CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Syntax check
        run: python -m compileall -q source tests migrations
      - name: Tests
        run: python -m pytest -q tests
      - name: Migration script validation
        run: python -m compileall -q migrations
      - name: JavaScript syntax
        run: |
          find source/static/js -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
      - name: Dependency vulnerability report
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt
